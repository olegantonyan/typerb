AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'

inherit_mode:
  merge:
    - Exclude

Style/CommentedKeyword:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/Semicolon:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Layout/SpaceAroundMethodCallOperator:
  Enabled: false

Layout/LineLength:
  Max: 170

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

Style:
  Exclude:
    - 'test/**/*'

Layout:
  Exclude:
    - 'test/**/*'

Metrics:
  Exclude:
    - 'test/**/*'

Lint/UselessRescue:
  Exclude:
    - 'test/**/*'

Naming/AsciiIdentifiers:
  Exclude:
    - 'test/**/*'

Security/Eval:
  Exclude:
    - 'test/**/*'
